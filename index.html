/* =========================================================================
   BIKE MAPS — "unbelievable" pass
   Signature idea: one continuous route line is the spine of the entire page.
   It starts in the hero, threads behind every section, and a glowing rider
   travels along it as the page is scrolled — turning scroll position itself
   into "distance ridden". Everything else (boot sequence, parallax canvas,
   comet cursor, magnetic buttons, tilt cards, odometer counters) reinforces
   that one idea instead of competing with it.
   ========================================================================= */

const FONTS_HREF =
  "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap";

const MINT = "#00e6a8";

/* ---------------- shared hooks ---------------- */

function useReveal(threshold = 0.15) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    const obs = new IntersectionObserver(
      (entries) => entries.forEach((e) => e.isIntersecting && setShown(true)),
      { threshold }
    );
    if (el) obs.observe(el);
    return () => obs.disconnect();
  }, [threshold]);
  return [ref, shown];
}

function useOdometer(target, { decimals = 0, duration = 1500 } = {}) {
  const [value, setValue] = useState(0);
  const ref = useRef(null);
  const done = useRef(false);
  useEffect(() => {
    const el = ref.current;
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting && !done.current) {
            done.current = true;
            const start = performance.now();
            const tick = (now) => {
              const p = Math.min(1, (now - start) / duration);
              const eased = 1 - Math.pow(1 - p, 4);
              setValue(target * eased);
              if (p < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
          }
        });
      },
      { threshold: 0.4 }
    );
    if (el) obs.observe(el);
    return () => obs.disconnect();
  }, [target, duration]);
  return [value.toFixed(decimals), ref];
}

/* scroll progress 0..1 across the whole document */
function useScrollProgress() {
  const [p, setP] = useState(0);
  useEffect(() => {
    let raf = null;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        const h = document.documentElement.scrollHeight - window.innerHeight;
        setP(h > 0 ? Math.min(1, Math.max(0, window.scrollY / h)) : 0);
        raf = null;
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return p;
}

function useMouseParallax() {
  const [pos, setPos] = useState({ x: 0, y: 0 });
  useEffect(() => {
    const onMove = (e) => {
      setPos({
        x: (e.clientX / window.innerWidth) * 2 - 1,
        y: (e.clientY / window.innerHeight) * 2 - 1,
      });
    };
    window.addEventListener("mousemove", onMove);
    return () => window.removeEventListener("mousemove", onMove);
  }, []);
  return pos;
}

/* ---------------- boot sequence ---------------- */

function BootSequence({ onDone }) {
  const [lines, setLines] = useState([]);
  const [pct, setPct] = useState(0);
  const [leaving, setLeaving] = useState(false);
  const steps = useMemo(
    () => [
      "INICIANDO BIKE MAPS OS v2.0.4",
      "PROCURANDO SATÉLITES ▸ GPS",
      "LAT -15.7801  LON -47.9292",
      "SINCRONIZANDO MAPA LOCAL",
      "CARREGANDO PERFIL DO CICLISTA",
      "CONEXÃO ESTÁVEL ▸ PRONTO",
    ],
    []
  );
  useEffect(() => {
    let i = 0;
    const interval = setInterval(() => {
      i += 1;
      setLines((prev) => [...prev, steps[i - 1]]);
      setPct(Math.round((i / steps.length) * 100));
      if (i >= steps.length) {
        clearInterval(interval);
        setTimeout(() => setLeaving(true), 260);
        setTimeout(() => onDone(), 760);
      }
    }, 210);
    return () => clearInterval(interval);
  }, [steps, onDone]);

  return (
    <div className={`bm-boot ${leaving ? "leave" : ""}`}>
      <div className="bm-boot-inner">
        <div className="bm-boot-mark">
          <Satellite size={20} color={MINT} />

    </div>
  );
}

/* ---------------- comet cursor ---------------- */

function CursorComet() {
  const dotsRef = useRef([]);
  const pos = useRef(Array.from({ length: 6 }, () => ({ x: 0, y: 0 })));
  const target = useRef({ x: 0, y: 0 });
  const bigRef = useRef(false);

  useEffect(() => {
    const move = (e) => { target.current = { x: e.clientX, y: e.clientY }; };
    const over = (e) => {
      if (e.target.closest("button, a, .bm-route-card, .bm-medal, .bm-feed-action, .bm-map-ctrl-btn, .bm-tilt")) {
        bigRef.current = true;
      }
    };
    const out = (e) => {
      if (e.target.closest("button, a, .bm-route-card, .bm-medal, .bm-feed-action, .bm-map-ctrl-btn, .bm-tilt")) {
        bigRef.current = false;
      }
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseover", over);
    window.addEventListener("mouseout", out);

    let raf;
    const tick = () => {
      let px = target.current.x, py = target.current.y;
      pos.current.forEach((p, i) => {
        const ease = i === 0 ? 0.32 : 0.32 - i * 0.02;
        p.x += (px - p.x) * Math.max(ease, 0.12);
        p.y += (py - p.y) * Math.max(ease, 0.12);
        px = p.x; py = p.y;
        const el = dotsRef.current[i];
        if (el) {
          const scale = bigRef.current ? 1.8 - i * 0.15 : 1 - i * 0.1;
          el.style.transform = `translate(${p.x}px, ${p.y}px) translate(-50%,-50%) scale(${Math.max(scale, 0.2)})`;
          el.style.opacity = String(1 - i * 0.15);
        }
      });
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);

    return () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseover", over);
      window.removeEventListener("mouseout", out);
      cancelAnimationFrame(raf);
    };
  }, []);

  return (
    <div className="bm-comet-wrap">
      {pos.current.map((_, i) => (
        <div
          key={i}
          ref={(el) => (dotsRef.current[i] = el)}
          className={`bm-comet-dot ${i === 0 ? "lead" : ""}`}
        />
      ))}
    </div>
  );
}

/* ---------------- master route spine ---------------- */
/* The single line that runs the full height of the page. Its reveal and the
   rider's position are both driven by scroll progress — scrolling *is* riding. */

function MasterRoute() {
  const progress = useScrollProgress();
  const [docHeight, setDocHeight] = useState(2000);
  const pathRef = useRef(null);
  const [length, setLength] = useState(0);

  useEffect(() => {
    const measure = () => setDocHeight(document.documentElement.scrollHeight);
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(document.body);
    window.addEventListener("resize", measure);
    const t = setInterval(measure, 800);
    return () => { ro.disconnect(); window.removeEventListener("resize", measure); clearInterval(t); };
  }, []);

  useEffect(() => {
    if (pathRef.current) setLength(pathRef.current.getTotalLength());
  }, [docHeight]);

  const d = useMemo(() => {
    const h = docHeight;
    const xs = [640, 120, 1080, 200, 960, 300, 640];
    const n = xs.length - 1;
    let path = `M ${xs[0]},0 `;
    for (let i = 0; i < n; i++) {
      const y1 = (h * (i + 0.5)) / n;
      const y2 = (h * (i + 1)) / n;
      path += `C ${xs[i]},${y1} ${xs[i + 1]},${y1} ${xs[i + 1]},${y2} `;
    }
    return path;
  }, [docHeight]);

  let point = { x: 640, y: 0 };
  let lean = 0;
  if (pathRef.current && length) {
    point = pathRef.current.getPointAtLength(length * progress);
    const ahead = pathRef.current.getPointAtLength(Math.min(length, length * progress + 30));
    const dx = ahead.x - point.x, dy = ahead.y - point.y || 1;
    lean = Math.max(-18, Math.min(18, Math.atan2(dx, dy) * (180 / Math.PI)));
  }
  const km = (progress * 42.0).toFixed(1);
  const spin = (progress * 3600) % 360;

  return (
    <div className="bm-master-route" style={{ height: docHeight }}>
      <svg width="100%" height={docHeight} viewBox={`0 0 1200 ${docHeight}`} preserveAspectRatio="none">
        <defs>
          <linearGradient id="spineFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={MINT} stopOpacity="0.9" />
            <stop offset="100%" stopColor={VIOLET} stopOpacity="0.9" />
          </linearGradient>
        </defs>
        <path d={d} fill="none" stroke="#172438" strokeWidth="2" />
        <path
          ref={pathRef}
          d={d}
          fill="none"
          stroke="url(#spineFade)"
          strokeWidth="2.5"
          strokeLinecap="round"
          strokeDasharray={length || 1}
          strokeDashoffset={length ? length * (1 - progress) : 0}
          style={{ filter: "drop-shadow(0 0 8px rgba(0,230,168,0.55))" }}
        />
      </svg>
      <div
        className="bm-rider-marker"
        style={{ transform: `translate(${(point.x / 1200) * 100}vw, ${point.y}px) translate(-50%,-50%)` }}
      >
        <div className="bm-rider-pulse" />
        <div className="bm-rider-bob">
          <BikeGraphic spin={spin} lean={lean} size={64} />
        </div>
        <div className="bm-rider-tag bm-mono">{km} KM</div>
      </div>
    </div>
  );
}

/* ---------------- bicycle graphic (detailed, wheels + crank spin with scroll) ---------------- */

function bikeSpokes(cx, cy, rInner, rOuter, count) {
  const lines = [];
  for (let i = 0; i < count; i++) {
    const a = (i * (Math.PI * 2)) / count;
    const x1 = cx + Math.cos(a) * rInner, y1 = cy + Math.sin(a) * rInner;
    const x2 = cx + Math.cos(a) * rOuter, y2 = cy + Math.sin(a) * rOuter;
    lines.push(<line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={MINT} strokeWidth="1" opacity="0.55" />);
  }
  return lines;
}

function BikeGraphic({ spin = 0, lean = 0, size = 64, glow = true }) {
  const REAR = { x: 56, y: 104 }, FRONT = { x: 184, y: 104 }, BB = { x: 118, y: 104 };
  const SEAT_TOP = { x: 96, y: 44 }, HEAD_TOP = { x: 166, y: 52 }, HEAD_BOT = { x: 172, y: 68 };
  const h = size * (150 / 240);
  return (
    <svg
      width={size} height={h} viewBox="0 0 240 150"
      style={{ transform: `rotate(${lean}deg)`, transition: "transform .35s ease-out", overflow: "visible" }}
    >
      <defs>
        <linearGradient id="bikeFrameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={MINT} />
          <stop offset="100%" stopColor="#00a97a" />
        </linearGradient>
        {glow && (
          <filter id="bikeGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="2.4" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        )}
      </defs>

      <g filter={glow ? "url(#bikeGlow)" : undefined}>
        {/* ground shadow */}
        <ellipse cx="120" cy="146" rx="100" ry="6" fill={MINT} opacity="0.08" />

        {/* frame — rear triangle + front triangle */}
        <g stroke="url(#bikeFrameGrad)" strokeWidth="4" strokeLinecap="round" fill="none">
          <line x1={REAR.x} y1={REAR.y} x2={BB.x} y2={BB.y} />
          <line x1={BB.x} y1={BB.y} x2={SEAT_TOP.x} y2={SEAT_TOP.y} />

/* ---------------- magnetic button ---------------- */

function Magnetic({ children, className, ...rest }) {
  const ref = useRef(null);
  const onMove = (e) => {
    const el = ref.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const x = e.clientX - r.left - r.width / 2;
    const y = e.clientY - r.top - r.height / 2;
    el.style.transform = `translate(${x * 0.28}px, ${y * 0.35}px)`;
  };
  const onLeave = () => {
    if (ref.current) ref.current.style.transform = "translate(0,0)";
  };
  return (
    <button ref={ref} className={`bm-magnetic ${className || ""}`} onMouseMove={onMove} onMouseLeave={onLeave} {...rest}>
      <span>{children}</span>
    </button>
  );
}

/* ---------------- 3d tilt wrapper ---------------- */

function Tilt({ children, className, style, max = 10 }) {
  const ref = useRef(null);
  const onMove = (e) => {
    const el = ref.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    el.style.transform = `perspective(700px) rotateX(${-py * max}deg) rotateY(${px * max}deg) translateZ(6px)`;
  };
  const onLeave = () => {
    if (ref.current) ref.current.style.transform = "perspective(700px) rotateX(0) rotateY(0) translateZ(0)";
  };
  return (
    <div ref={ref} className={`bm-tilt ${className || ""}`} style={style} onMouseMove={onMove} onMouseLeave={onLeave}>
      {children}
    </div>
  );
}

/* ---------------- perspective canvas background ---------------- */

function PerspectiveCanvas() {
  const canvasRef = useRef(null);
  const mouse = useMouseParallax();
  const mouseRef = useRef(mouse);
  mouseRef.current = mouse;

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let raf, w, h, dpr;
    const particles = Array.from({ length: 70 }, () => ({
      x: Math.random(), y: Math.random(), z: Math.random() * 0.8 + 0.2,
      vx: (Math.random() - 0.5) * 0.0004, vy: (Math.random() - 0.5) * 0.0004,
    }));

    const resize = () => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.clientWidth; h = canvas.clientHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    window.addEventListener("resize", resize);

    let t = 0;
    const draw = () => {
      t += 1;
      ctx.clearRect(0, 0, w, h);
      const mx = mouseRef.current.x, my = mouseRef.current.y;

      // perspective grid: horizon lines converging toward vanishing point
      const vpX = w / 2 + mx * 30;
      const vpY = h * 0.42 + my * 14;
      ctx.save();
      ctx.strokeStyle = "rgba(0,230,168,0.10)";
      ctx.lineWidth = 1;
      const rows = 14;
      for (let i = 1; i <= rows; i++) {
        const f = i / rows;
        const y = vpY + (h - vpY) * Math.pow(f, 1.6);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.globalAlpha = 0.5 * (1 - f) + 0.05;
        ctx.stroke();
      }
      const cols = 16;
      for (let i = 0; i <= cols; i++) {
        const fx = i / cols;
        const xBottom = fx * w;
        ctx.beginPath();
        ctx.moveTo(vpX, vpY);
        ctx.lineTo(xBottom, h);
        ctx.globalAlpha = 0.16;
        ctx.stroke();
      }
      ctx.restore();

      // floating particles with parallax
      ctx.save();
      particles.forEach((p) => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > 1) p.vx *= -1;
        if (p.y < 0 || p.y > 1) p.vy *= -1;
        const px = p.x * w + mx * 18 * p.z;
        const py = p.y * h * 0.85 + my * 10 * p.z;
        const r = 0.6 + p.z * 1.6;
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0,230,168,${0.15 + p.z * 0.35})`;
        ctx.fill();
      });
      ctx.restore();

      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); };
  }, []);

  return <canvas ref={canvasRef} className="bm-perspective-canvas" />;
}

function SimpleAreaChart({ data }) {
  const W = 760, H = 260, padL = 34, padR = 10, padT = 10, padB = 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxSpeed = Math.max(...data.map((d) => d.speed)) * 1.15;
  const maxElev = Math.max(...data.map((d) => d.elev)) * 1.6;
  const xAt = (i) => padL + (i / (data.length - 1)) * innerW;
  const yAt = (v, max) => padT + innerH - (v / max) * innerH;

  const linePath = (key, max) =>
    data.map((d, i) => `${i === 0 ? "M" : "L"} ${xAt(i)},${yAt(d[key], max)}`).join(" ");
  const areaPath = (key, max) =>
    `${linePath(key, max)} L ${xAt(data.length - 1)},${padT + innerH} L ${xAt(0)},${padT + innerH} Z`;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100%" preserveAspectRatio="none">
      <defs>
        <linearGradient id="speedGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={MINT} stopOpacity="0.5" />
          <stop offset="100%" stopColor={MINT} stopOpacity="0" />
        </linearGradient>
        <linearGradient id="elevGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={VIOLET} stopOpacity="0.35" />
          <stop offset="100%" stopColor={VIOLET} stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0.25, 0.5, 0.75, 1].map((f) => (
        <line key={f} x1={padL} x2={W - padR} y1={padT + innerH * (1 - f)} y2={padT + innerH * (1 - f)} stroke="#172438" strokeWidth="1" />
      ))}
      <path d={areaPath("elev", maxElev)} fill="url(#elevGrad)" />
      <path d={linePath("elev", maxElev)} fill="none" stroke={VIOLET} strokeWidth="2" />
      <path d={areaPath("speed", maxSpeed)} fill="url(#speedGrad)" />
      <path d={linePath("speed", maxSpeed)} fill="none" stroke={MINT} strokeWidth="2.5" />
      {data.map((d, i) => (
        <circle key={i} cx={xAt(i)} cy={yAt(d.speed, maxSpeed)} r="3" fill={MINT} />
      ))}
      {data.map((d, i) => (
        <text key={i} x={xAt(i)} y={H - 6} fontSize="10" fill="#7c8798" textAnchor="middle" fontFamily="JetBrains Mono, monospace">{d.km}km</text>
      ))}
    </svg>
  );
}

        display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--mute);
        padding: 6px 12px; border: 1px solid var(--line); border-radius: 100px; background: rgba(255,255,255,0.02);
      }
      .bm-dot-live { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 8px var(--mint); animation: bm-pulse 1.6s ease-in-out infinite; }
      @keyframes bm-pulse { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }

      /* ---------- buttons / magnetic ---------- */
      .bm-btn, .bm-magnetic {
        display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 10px;
        font-size: 14px; font-weight: 600; border: none; cursor: none; font-family: 'Inter', sans-serif;
        transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
      }
      .bm-magnetic { transition: transform .12s ease-out, box-shadow .2s ease; }
      .bm-magnetic span { display: inline-flex; align-items: center; gap: 8px; }
      .bm-btn-primary, .bm-magnetic.bm-btn-primary { background: var(--mint); color: #04140f; }
      .bm-btn-primary:hover, .bm-magnetic.bm-btn-primary:hover { box-shadow: 0 8px 28px var(--mint-dim); }
      .bm-btn-ghost, .bm-magnetic.bm-btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
      .bm-btn-ghost:hover, .bm-magnetic.bm-btn-ghost:hover { border-color: var(--mute-dim); }

      /* ---------- hero ---------- */
      .bm-hero { position: relative; min-height: 96vh; display: flex; flex-direction: column; justify-content: center; padding: 40px 32px 80px; overflow: hidden; border-bottom: 1px solid var(--line); }
      .bm-perspective-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
      .bm-hero-glow {
        position: absolute; width: 900px; height: 900px; border-radius: 50%;
        background: radial-gradient(circle, var(--mint-dim) 0%, transparent 65%); top: -420px; left: 50%; transform: translateX(-50%);
        pointer-events: none; animation: bm-drift 12s ease-in-out infinite; z-index: 1;
      }
      @keyframes bm-drift { 0%,100%{ transform: translate(-50%,0) scale(1);} 50%{ transform: translate(-46%,20px) scale(1.06);} }
      .bm-hero-inner { position: relative; z-index: 3; max-width: 1240px; margin: 0 auto; width: 100%; }
      .bm-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mint); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 22px; font-weight: 600; }
      .bm-eyebrow-line { width: 28px; height: 1px; background: var(--mint); }
      .bm-hero-title { font-size: clamp(44px, 7vw, 92px); line-height: 0.98; font-weight: 700; letter-spacing: -0.03em; max-width: 900px; margin: 0 0 24px; }
      .bm-hero-title .accent-line { color: var(--mint); font-style: italic; font-weight: 500; }
      .bm-hero-sub { font-size: 18px; color: var(--mute); max-width: 460px; line-height: 1.6; margin-bottom: 36px; opacity: 0; }
      .bm-hero-actions { display: flex; gap: 14px; align-items: center; opacity: 0; }

      .bm-fade-up { animation: bm-fade-up-kf .8s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes bm-fade-up-kf { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

      .bm-word-mask { display: inline-block; overflow: hidden; vertical-align: top; margin-right: 0.28em; }
      .bm-word { display: inline-block; transform: translateY(110%) rotate(4deg); opacity: 0; animation: bm-word-in .9s cubic-bezier(.2,.7,.15,1) forwards; }
      @keyframes bm-word-in { to { transform: translateY(0) rotate(0); opacity: 1; } }

      .bm-scroll-cue {
        position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 3;
        display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 0.14em;
        color: var(--mute); opacity: 0; animation: bm-fade-up-kf 1s ease 1.5s forwards;
      }
      .bm-scroll-cue-line { width: 1px; height: 34px; background: linear-gradient(var(--mint), transparent); animation: bm-scroll-cue-kf 1.8s ease-in-out infinite; }
      @keyframes bm-scroll-cue-kf { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

      .bm-float-card {
        position: absolute; z-index: 4; background: rgba(11,15,22,0.7); backdrop-filter: blur(14px);
        border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        animation: bm-float 6s ease-in-out infinite; transition: transform .15s ease-out;
      }
      .bm-float-card .fc-label { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--mute); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; font-weight: 600; }
      .bm-float-card .fc-value { font-size: 20px; font-weight: 700; }
      .bm-float-card .fc-value span { font-size: 12px; color: var(--mute); font-weight: 500; }
      @keyframes bm-float { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-14px);} }

      .bm-hero-bike {
        position: absolute; z-index: 3; right: 2%; bottom: 4%;
        opacity: 0; animation: bm-fade-up-kf 1.1s ease .35s forwards, bm-float 7s ease-in-out 1.4s infinite;
        pointer-events: none;
      }
      @media (max-width: 1100px) { .bm-hero-bike { right: -6%; bottom: -2%; opacity: 0.5 !important; } }
      @media (max-width: 700px) { .bm-hero-bike { display: none; } }

      .bm-route-svg { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; }
      .bm-route-path { fill: none; stroke: var(--mint); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 8 10; opacity: 0.9; animation: bm-dash 26s linear infinite; filter: drop-shadow(0 0 6px var(--mint-dim)); }
      @keyframes bm-dash { to { stroke-dashoffset: -1000; } }
      .bm-route-node { fill: var(--mint); }
      .bm-route-tag {
        position: absolute; z-index: 3; transform: translate(-50%,-50%); font-family: 'JetBrains Mono', monospace;
        font-size: 10px; color: var(--mint); background: rgba(5,7,11,0.65); border: 1px solid var(--mint-dim);
        padding: 3px 8px; border-radius: 100px; white-space: nowrap; pointer-events: none;
        animation: bm-tag-in 1s ease both, bm-float 5s ease-in-out infinite;
        animation-delay: 1.6s, 1.6s;
      }
      @keyframes bm-tag-in { from { opacity: 0; transform: translate(-50%,-50%) scale(.6); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }

      /* ---------- persistent micro badge ---------- */
      .bm-micro-badge {
        position: fixed; left: 20px; bottom: 20px; z-index: 90; display: flex; gap: 8px;
        opacity: 0; animation: bm-fade-up-kf .6s ease 2.4s forwards;
      }
      .bm-micro-chip {
        display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--mute);
        background: rgba(5,7,11,0.75); border: 1px solid var(--line); padding: 6px 10px; border-radius: 100px;
        backdrop-filter: blur(8px); font-family: 'JetBrains Mono', monospace;
      }
      .bm-micro-chip .live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 6px var(--mint); animation: bm-pulse 1.6s ease-in-out infinite; }
      @media (max-width: 860px) { .bm-micro-badge { display: none; } }

      /* ---------- ticker ---------- */
      .bm-ticker-wrap { border-bottom: 1px solid var(--line); background: var(--bg2); overflow: hidden; padding: 12px 0; position: relative; z-index: 2; }
      .bm-ticker { display: flex; gap: 48px; white-space: nowrap; animation: bm-scroll 32s linear infinite; width: max-content; }
      .bm-ticker-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mute); }
      .bm-ticker-item b { color: var(--ink); font-weight: 600; }
      @keyframes bm-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

      /* ---------- generic section ---------- */
      .bm-section { position: relative; padding: 130px 32px; border-bottom: 1px solid var(--line); overflow: hidden; z-index: 2; }
      .bm-section-inner { max-width: 1240px; margin: 0 auto; position: relative; z-index: 2; }
      .bm-section-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 56px; gap: 24px; flex-wrap: wrap; }
      .bm-kicker { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mint); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; margin-bottom: 14px; }
      .bm-section-title { font-size: clamp(30px, 4vw, 48px); font-weight: 700; letter-spacing: -0.02em; max-width: 640px; }
      .bm-section-desc { color: var(--mute); max-width: 380px; font-size: 15px; line-height: 1.6; }
      .bm-reveal { opacity: 0; transform: translateY(36px); transition: opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1); }
      .bm-reveal.in { opacity: 1; transform: translateY(0); }

      /* ---------- tilt wrapper ---------- */
      .bm-tilt { transition: transform .15s ease-out; transform-style: preserve-3d; will-change: transform; }

      /* ---------- map section ---------- */
      .bm-map-wrap { display: grid; grid-template-columns: 1.6fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; min-height: 560px; }
      .bm-map-canvas { position: relative; background: var(--bg2); overflow: hidden; }
      .bm-map-grid { position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 40px 40px; opacity: 0.6; }
      .bm-map-controls { position: absolute; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
      .bm-map-ctrl-btn { width: 36px; height: 36px; border-radius: 10px; background: rgba(5,7,11,0.8); border: 1px solid var(--line); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; cursor: none; backdrop-filter: blur(8px); transition: border-color .2s; }
      .bm-map-ctrl-btn:hover { border-color: var(--mint); color: var(--mint); }
      .bm-map-hud { position: absolute; bottom: 16px; left: 16px; display: flex; gap: 10px; z-index: 5; }
      .bm-hud-chip { display: flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 8px; background: rgba(5,7,11,0.75); border: 1px solid var(--line); font-size: 11px; color: var(--mute); backdrop-filter: blur(8px); }
      .bm-map-marker { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px var(--mint-dim); animation: bm-pulse 2s ease-in-out infinite; }
      .bm-map-marker.violet { background: var(--violet); box-shadow: 0 0 0 4px var(--violet-dim); animation-delay: .4s; }
      .bm-map-marker.amber { background: var(--amber); box-shadow: 0 0 0 4px #ff8a4c33; animation-delay: .8s; }
      .bm-sidebar { background: var(--bg2); padding: 22px; display: flex; flex-direction: column; }
      .bm-sidebar-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--mute); font-weight: 600; margin-bottom: 16px; }
      .bm-route-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; cursor: none; transition: border-color .2s, background .2s, transform .2s; background: rgba(255,255,255,0.015); }
      .bm-route-card:hover { border-color: var(--mint); background: rgba(0,230,168,0.05); transform: translateX(4px); }
      .bm-route-card.active { border-color: var(--mint); background: rgba(0,230,168,0.07); }
      .bm-route-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      .bm-route-card-name { font-weight: 600; font-size: 14px; }
      .bm-route-card-meta { display: flex; gap: 12px; font-size: 11px; color: var(--mute); }
      .bm-route-card-meta span { display: flex; align-items: center; gap: 4px; }
      .bm-diff-badge { font-size: 10px; padding: 3px 8px; border-radius: 100px; font-weight: 600; }
      .bm-diff-easy { background: #00e6a822; color: var(--mint); }
      .bm-diff-med { background: #ff8a4c22; color: var(--amber); }
      .bm-diff-hard { background: #ff5c5c22; color: #ff5c5c; }

      /* ---------- dashboard ---------- */
      .bm-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; margin-bottom: 24px; }
      .bm-stat-cell { background: var(--bg2); padding: 26px 24px; }
      .bm-stat-cell .icon-wrap { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: rgba(0,230,168,0.08); color: var(--mint); margin-bottom: 18px; }
      .bm-stat-cell .icon-wrap.violet { background: var(--violet-dim); color: var(--violet); }
      .bm-stat-cell .icon-wrap.amber { background: #ff8a4c22; color: var(--amber); }
      .bm-stat-label { font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; font-weight: 600; }
      .bm-stat-value { font-size: 30px; font-weight: 700; }
      .bm-stat-value small { font-size: 14px; color: var(--mute); font-weight: 500; margin-left: 2px; }
      .bm-chart-panel { background: var(--bg2); border: 1px solid var(--line); border-radius: 20px; padding: 28px; margin-bottom: 24px; }
      .bm-chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      .bm-compare-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--mint); background: rgba(0,230,168,0.08); padding: 6px 12px; border-radius: 100px; }

      /* ---------- achievements ---------- */
      .bm-medal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
      .bm-medal { background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; padding: 24px; position: relative; overflow: hidden; cursor: none; }
      .bm-medal.locked { opacity: 0.45; filter: grayscale(0.6); }
      .bm-medal-badge { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #12261f, #0b0f16); border: 1px solid var(--mint-dim); margin-bottom: 16px; box-shadow: 0 0 26px var(--mint-dim), inset 0 1px 0 rgba(255,255,255,0.06); color: var(--mint); }
      .bm-medal-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
      .bm-medal-desc { font-size: 12px; color: var(--mute); margin-bottom: 14px; }
      .bm-progress-track { height: 4px; border-radius: 100px; background: var(--line); overflow: hidden; margin-bottom: 6px; }
      .bm-progress-fill { height: 100%; background: linear-gradient(90deg, var(--mint), #00a97a); border-radius: 100px; transition: width 1.2s cubic-bezier(.2,.7,.2,1); }
      .bm-progress-pct { font-size: 11px; color: var(--mute); font-family: 'JetBrains Mono', monospace; }

      /* ---------- community ---------- */
      .bm-feed { display: flex; flex-direction: column; gap: 16px; max-width: 640px; }
      .bm-feed-card { background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; padding: 18px; cursor: none; }
      .bm-feed-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      .bm-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--violet), #4a3fd6); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
      .bm-feed-name { font-weight: 600; font-size: 14px; }
      .bm-feed-time { font-size: 11px; color: var(--mute); }
      .bm-feed-map { height: 120px; border-radius: 10px; background: var(--bg3); position: relative; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--line); }
      .bm-feed-stats { display: flex; gap: 18px; margin-bottom: 12px; }
      .bm-feed-stat { font-size: 12px; color: var(--mute); }
      .bm-feed-stat b { color: var(--ink); display: block; font-size: 15px; font-weight: 700; }
      .bm-feed-actions { display: flex; gap: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
      .bm-feed-action { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--mute); cursor: none; transition: color .2s; }
      .bm-feed-action:hover { color: var(--mint); }
      .bm-feed-challenge { padding: 14px; background: rgba(124,108,255,0.06); border: 1px solid var(--violet-dim); border-radius: 12px; margin-bottom: 12px; }
      .bm-feed-challenge-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--mute); margin-bottom: 10px; }
      .bm-feed-challenge-top span:first-child { display: flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 500; }

      /* ---------- sos ---------- */
      .bm-sos-panel { display: grid; grid-template-columns: 220px 1fr; gap: 40px; align-items: center; background: linear-gradient(135deg, #14100c, var(--bg2)); border: 1px solid var(--line); border-radius: 24px; padding: 44px; position: relative; z-index: 2; }
      .bm-sos-btn { width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8a4c, #b0421a); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; box-shadow: 0 0 0 8px #ff8a4c14, 0 20px 60px rgba(255,138,76,0.25); font-weight: 700; font-size: 22px; letter-spacing: 0.05em; color: #1a0d05; animation: bm-sos-pulse 2.4s ease-in-out infinite; cursor: none; }
      @keyframes bm-sos-pulse { 0%,100% { box-shadow: 0 0 0 8px #ff8a4c14, 0 20px 60px rgba(255,138,76,0.25);} 50% { box-shadow: 0 0 0 16px #ff8a4c22, 0 20px 70px rgba(255,138,76,0.35);} }
      .bm-sos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .bm-sos-status { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--mute); padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.015); }
      .bm-sos-status .ok { color: var(--mint); margin-left: auto; font-size: 11px; font-weight: 700; }

      /* ---------- profile ---------- */
      .bm-profile-grid { display: grid; grid-template-columns: 340px 1fr; gap: 24px; }
      .bm-profile-card { background: linear-gradient(160deg, #0e1a16, var(--bg2)); border: 1px solid var(--line); border-radius: 20px; padding: 28px; }
      .bm-profile-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
      .bm-profile-avatar { width: 60px; height: 60px; border-radius: 16px; background: linear-gradient(135deg, var(--mint), #00a97a); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; color: #04140f; box-shadow: 0 0 30px var(--mint-dim); }
      .bm-profile-level { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--mint); background: rgba(0,230,168,0.1); padding: 5px 10px; border-radius: 100px; border: 1px solid var(--mint-dim); }
      .bm-profile-name { font-size: 22px; font-weight: 700; }
      .bm-profile-handle { font-size: 12px; color: var(--mute); margin-bottom: 22px; }
      .bm-profile-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
      .bm-profile-stat-label { font-size: 10px; color: var(--mute); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
      .bm-profile-stat-value { font-size: 18px; font-weight: 700; }
      .bm-profile-stat-value small { font-size: 11px; color: var(--mute); font-weight: 500; }
      .bm-profile-medals { display: flex; flex-wrap: wrap; gap: 8px; }
      .bm-mini-medal { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--amber); background: #ff8a4c14; border: 1px solid #ff8a4c33; padding: 5px 9px; border-radius: 100px; }
      .bm-timeline { background: var(--bg2); border: 1px solid var(--line); border-radius: 20px; padding: 26px; }
      .bm-timeline-item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
      .bm-timeline-item:last-child { border-bottom: none; }
      .bm-timeline-dot { width: 30px; height: 30px; min-width: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: var(--mint-dim); color: var(--mint); }
      .bm-timeline-dot.conquista { background: #ff8a4c22; color: var(--amber); }
      .bm-timeline-dot.desafio { background: var(--violet-dim); color: var(--violet); }
      .bm-timeline-label { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
      .bm-timeline-meta { font-size: 11px; color: var(--mute); }

      /* ---------- store ---------- */
      .bm-store-search { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); border: 1px solid var(--line); border-radius: 100px; padding: 10px 16px; min-width: 220px; }
      .bm-store-banner { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(120deg, var(--mint), #00c495); border-radius: 20px; padding: 30px 34px; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
      .bm-store-banner-title { color: #04140f; font-size: 24px; font-weight: 700; margin-top: 6px; }
      .bm-btn-dark { background: #04140f; color: var(--mint); border-radius: 10px; padding: 11px 18px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; border: none; cursor: none; }
      .bm-store-cats { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
      .bm-cat-pill { padding: 9px 16px; border-radius: 100px; border: 1px solid var(--line); background: transparent; color: var(--mute); font-size: 13px; cursor: none; transition: all .2s; }
      .bm-cat-pill:hover { color: var(--ink); border-color: var(--mute-dim); }
      .bm-cat-pill.active { background: var(--mint); color: #04140f; border-color: var(--mint); font-weight: 600; }
      .bm-product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
      .bm-product-card { background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; padding: 16px; cursor: none; }
      .bm-product-media { height: 130px; border-radius: 12px; background: radial-gradient(circle at 30% 20%, #142235, var(--bg3)); position: relative; display: flex; align-items: center; justify-content: center; color: var(--mint); margin-bottom: 14px; overflow: hidden; transition: transform .3s ease; }
      .bm-product-card:hover .bm-product-media { transform: scale(1.04); }
      .bm-product-off { position: absolute; top: 10px; left: 10px; background: var(--amber); color: #200; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; }
      .bm-product-fav { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: rgba(5,7,11,0.7); display: flex; align-items: center; justify-content: center; color: var(--mute); }
      .bm-product-cat { font-size: 10px; color: var(--mute); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
      .bm-product-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
      .bm-product-rating { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--amber); margin-bottom: 10px; }
      .bm-product-price-row { display: flex; align-items: baseline; gap: 8px; }
      .bm-product-price { font-size: 17px; font-weight: 700; }
      .bm-product-old { font-size: 12px; color: var(--mute); text-decoration: line-through; }
      .bm-product-install { font-size: 11px; color: var(--mute); margin-bottom: 12px; }
      .bm-btn-add { width: 100%; padding: 10px; border-radius: 9px; background: transparent; border: 1px solid var(--mint-dim); color: var(--mint); font-weight: 600; font-size: 12px; cursor: none; transition: background .2s; }
      .bm-btn-add:hover { background: rgba(0,230,168,0.1); }

      /* ---------- mobile bottom nav ---------- */
      .bm-mobile-nav { display: none; }

      /* ---------- footer ---------- */
      .bm-footer { padding: 60px 32px 40px; position: relative; z-index: 2; }
      .bm-footer-inner { max-width: 1240px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
      .bm-footer-meta { font-size: 12px; color: var(--mute-dim); font-family: 'JetBrains Mono', monospace; }

      @media (max-width: 860px) {
        .bm-nav-links { display: none; }
        .bm-map-wrap { grid-template-columns: 1fr; }
        .bm-stat-grid { grid-template-columns: repeat(2, 1fr); }
        .bm-medal-grid { grid-template-columns: repeat(2, 1fr); }
        .bm-sos-panel { grid-template-columns: 1fr; text-align: center; }
        .bm-sos-btn { margin: 0 auto; }
        .bm-rider-tag { display: none; }
        .bm-profile-grid { grid-template-columns: 1fr; }
        .bm-product-grid { grid-template-columns: repeat(2, 1fr); }
        .bm-footer { padding-bottom: 100px; }
        .bm-mobile-nav {
          display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
          background: rgba(5,7,11,0.9); backdrop-filter: blur(16px); border-top: 1px solid var(--line);
          padding: 10px 6px calc(10px + env(safe-area-inset-bottom));
          justify-content: space-around;
        }
        .bm-mobile-nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--mute); text-decoration: none; font-size: 10px; padding: 4px 10px; border-radius: 10px; transition: color .2s; }
        .bm-mobile-nav-item.active { color: var(--mint); }
      }
    `}</style>
  );
}

window.__bmMounted = true;
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
document.getElementById("bm-fallback").style.display = "none";
} catch (err) {
  window.__bmMounted = true;
  var fb = document.getElementById("bm-fallback");
  fb.style.display = "block";
  fb.innerHTML = "Erro ao montar a página.<br><br>Erro: <code>" +
    (err && err.message ? err.message : String(err)) + "</code><br><br>" +
    "Abra o Console do navegador (F12) e me envie a mensagem completa de erro.";
  console.error(err);
}
